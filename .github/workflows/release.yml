name: release

# Tag-driven releases. Pushing vX.Y.Z checks that the tag is on main and
# matches build.zig.zon, creates a GitHub Release whose notes are that
# version's CHANGELOG.md section, then, on each platform with a runner, re-runs
# the suite on the tagged tree, builds a static ReleaseSafe binary, checks it
# reports the tag, and uploads a tarball, a .deb and an .rpm, their checksums
# and a signed build provenance attestation. A Mac builds the Mac app and
# uploads its zip the same way. Last, the Arch package's PKGBUILD is written
# from the published tarballs, checked on Arch, put on the release, and
# published to the AUR when the repository has an AUR key. The procedure is docs/cookbook/releasing.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Two pushes of one tag must not race to publish it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The ancestry check reads main's history, which a clone of one tag
          # does not carry.
          fetch-depth: 0

      # A release is cut from main. A tag on a branch that never merged would
      # publish code no review saw.
      - name: Check the tag is on main
        shell: bash
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "ERROR: ${GITHUB_REF_NAME} ($GITHUB_SHA) is not on main; tag a commit that main contains" >&2
            exit 1
          fi
          echo "ok: ${GITHUB_REF_NAME} is on main"

      # The version has one home, build.zig.zon, and `niimbench --version`
      # reads it at build time. A tag that disagrees fails here instead of
      # publishing a binary that reports a version nobody tagged.
      - name: Check the tag matches build.zig.zon
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in v*) ;; *) echo "ERROR: tag '$TAG' does not start with 'v'" >&2; exit 1;; esac
          SHIPPED="$(sed -n 's/^ *\.version = "\([^"]*\)",.*/\1/p' build.zig.zon | head -1)"
          if [ -z "$SHIPPED" ]; then
            echo "ERROR: no .version = \"...\" in build.zig.zon" >&2
            exit 1
          fi
          if [ "$SHIPPED" != "${TAG#v}" ]; then
            echo "ERROR: tag $TAG but build.zig.zon says $SHIPPED; make them match before tagging" >&2
            exit 1
          fi
          echo "ok: tag $TAG matches build.zig.zon ($SHIPPED)"

      # The notes are this version's own CHANGELOG.md section, so a release
      # cannot ship without its entry and the notes are never boilerplate.
      - name: Create the GitHub Release from the changelog section
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          NOTES="$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && (/^## / || /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md)"
          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            echo "ERROR: CHANGELOG.md has no ## [$VERSION] section; add one before tagging $TAG" >&2
            exit 1
          fi
          if gh release view "$TAG" --json id -q .id >/dev/null 2>&1; then
            echo "release $TAG already exists; the binaries are re-uploaded below"
          else
            gh release create "$TAG" --verify-tag --title "niimbench ${VERSION}" --notes "$NOTES"
          fi

  publish:
    needs: release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write
      # The attestation is signed with the runner's OIDC identity and stored
      # through the attestations API; no other step needs either.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # niimbench links no libc, so each build is a static binary that
          # runs on any distribution, and each target has a runner of its own
          # architecture that tests it before it ships.
          #
          # The browser checks need stable Google Chrome, which has no arm64
          # Linux build; the Chromium on that runner never exits --dump-dom.
          # They run on x86_64 here and on every push in CI.
          - os: ubuntu-24.04
            target: x86_64-linux
            browser_checks: true
          - os: ubuntu-24.04-arm
            target: aarch64-linux
            browser_checks: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # make test runs make labels-check, which runs tools/fetch-labels.py,
      # and Python runs through uv here as everywhere.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      # The whole suite, on the tagged tree.
      - name: Test the tagged tree
        if: matrix.browser_checks
        run: make test
      # An empty BROWSER is the Makefile's way to skip the browser checks,
      # loudly; everything else still runs, `zig build test` included.
      - name: Test the tagged tree, without the browser checks
        if: ${{ !matrix.browser_checks }}
        env:
          BROWSER: ""
        run: make test
      - name: Install nfpm
        run: |
          tools/get-nfpm.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # The static ReleaseSafe binary, its tarball and the .deb and .rpm, the
      # same script CI runs. It fails unless the binary is static and reports
      # build.zig.zon's version, which the release job matched to the tag.
      # The tarball carries the fonts' licences, which their terms require.
      - name: Build the binary, the tarball and the packages
        run: tools/linux-dist.sh ${{ matrix.target }} dist
      - name: Install each package as a person does
        run: |
          tools/linux-package-check.sh dist/niimbench-${{ matrix.target }}.deb debian:stable-slim
          tools/linux-package-check.sh dist/niimbench-${{ matrix.target }}.rpm fedora:42
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/*.tar.gz dist/*.deb dist/*.rpm dist/*.sha256 --clobber

  # The Mac app, built on a Mac because the bundle tools are Apple's. The
  # binary inside is both architectures, so one runner makes it; the suite
  # runs here first, as on the Linux runners.
  macos-app:
    needs: release
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
      - name: Test the tagged tree
        run: zig build test --summary all
      # tools/macos-app.sh fails unless the binary reports build.zig.zon's
      # version, which the release job has already matched to the tag.
      - name: Build niimbench.app
        run: tools/macos-app.sh dist
      - name: Open it as Finder does
        run: tools/macos-app-check.sh dist/niimbench.app
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/niimbench-macos.zip
      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/niimbench-macos.zip dist/niimbench-macos.zip.sha256 --clobber

  # The Arch package niimbench-bin, written from the tarballs just published
  # and their checksums, then built, installed and checked on Arch as CI does.
  # Its PKGBUILD goes on the release, where `makepkg -si` installs it without
  # the AUR. tools/aur-push.sh also publishes it to the AUR when the
  # AUR_SSH_PRIVATE_KEY secret is set, and says it did not otherwise; the
  # .SRCINFO the AUR needs is kept on the run either way, for publishing by
  # hand (docs/cookbook/releasing.md#the-aur-package).
  aur:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Write the PKGBUILD and .SRCINFO
        run: tools/aur.sh "${GITHUB_REF_NAME#v}" "$RUNNER_TEMP/aur"
      - name: Build, install and check it on Arch
        run: tools/aur-check.sh "$RUNNER_TEMP/aur"
      - name: Checksum the PKGBUILD
        run: (cd "$RUNNER_TEMP/aur" && sha256sum PKGBUILD > PKGBUILD.sha256 && cat PKGBUILD.sha256)
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/aur/PKGBUILD
      - name: Upload the PKGBUILD to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" "$RUNNER_TEMP/aur/PKGBUILD" "$RUNNER_TEMP/aur/PKGBUILD.sha256" --clobber
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: niimbench-bin-aur
          path: |
            ${{ runner.temp }}/aur/PKGBUILD
            ${{ runner.temp }}/aur/.SRCINFO
          include-hidden-files: true
          if-no-files-found: error
      - name: Publish to the AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: tools/aur-push.sh "$RUNNER_TEMP/aur"
