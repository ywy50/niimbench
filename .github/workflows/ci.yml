name: CI

# Every push to main and every pull request runs the formatter check and the
# whole of `make test`: the page lint, the node checks, the headless-browser
# harnesses and `zig build test`. CI runs exactly what a person runs, so a
# green check means the same thing in both places.

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing here writes back to the repository, and without
# this the token inherits the repository default, which every action in the
# run would get.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Actions are pinned by full commit SHA, the tag in the comment, so a
      # moved tag or a compromised release cannot change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
      # tools/drive.js speaks to the browser over the WebSocket global, which
      # Node has from 22; the runner's own Node is older.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check Zig formatting
        run: zig fmt --check build.zig build.zig.zon src
      # The runner ships Google Chrome, which the Makefile finds by itself, so
      # the browser checks run here rather than skip.
      - name: make test
        run: make test

  # macOS reaches Bluetooth through CoreBluetooth instead of BlueZ
  # (src/corebluetooth.zig). This job runs `zig build test` on a Mac, where the
  # CoreBluetooth checks run instead of skipping, then serves the page once.
  # The runner has no Bluetooth radio, so the live scan check answers with why
  # it cannot listen; printing to a printer is checked by hand.
  macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
      - name: zig build test
        run: zig build test --summary all
      - name: Serve the page
        run: |
          zig build
          tools/with-server.sh sh -c 'curl -fsSL -b "" -o "$NIIMBENCH_DIR/page.html" "$NIIMBENCH_URL" && grep -q "<title>niimbench" "$NIIMBENCH_DIR/page.html"'

  # The Mac app. tools/macos-app.sh builds niimbench.app, one binary for both
  # kinds of Mac signed ad hoc, and tools/macos-app-check.sh opens it the way
  # Finder does: it serves, a second open finds the first, and Quit stops it.
  # The zip is kept on the run, so a pull request's app can be tried on a Mac
  # before it is released.
  macos-app:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
      - name: Build niimbench.app
        run: tools/macos-app.sh
      - name: Open it as Finder does
        run: tools/macos-app-check.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: niimbench-macos
          path: |
            zig-out/macos/niimbench-macos.zip
            zig-out/macos/niimbench-macos.zip.sha256
          if-no-files-found: error

  # The Linux packages. tools/linux-dist.sh builds the tarball, the .deb and
  # the .rpm the way a release does, and tools/linux-package-check.sh installs
  # each in a clean container with apt or dnf, checks what it put where, and
  # starts it as its menu entry does. The files are kept on the run.
  linux-packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
      - name: Install nfpm
        run: |
          tools/get-nfpm.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build the tarball and the packages
        run: tools/linux-dist.sh x86_64-linux
      - name: Install the .deb on Debian
        run: tools/linux-package-check.sh zig-out/dist/niimbench-x86_64-linux.deb debian:stable-slim
      - name: Install the .rpm on Fedora
        run: tools/linux-package-check.sh zig-out/dist/niimbench-x86_64-linux.rpm fedora:42
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: niimbench-linux-x86_64
          path: |
            zig-out/dist/*.tar.gz
            zig-out/dist/*.deb
            zig-out/dist/*.rpm
            zig-out/dist/*.sha256
          if-no-files-found: error
