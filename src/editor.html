<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>niimbench</title>
  <style>
    :root { color-scheme: light dark; font-family: sans-serif; }
    body { margin: 2rem auto; max-width: 52rem; }
    header { display: flex; justify-content: space-between; align-items: baseline; }
    form, fieldset { display: grid; gap: 0.6rem; }
    label { display: grid; gap: 0.2rem; }
    .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6rem; }
    canvas { width: 100%; background: white; border: 1px solid #888; image-rendering: pixelated; }
    pre { min-height: 1.2rem; }
  </style>
</head>
<body>
  <header>
    <h1>niimbench</h1>
    <p id="status">idle</p>
  </header>
  <form id="label">
    <label>Image <input id="file" type="file" accept="image/*"></label>
    <canvas id="preview" width="384" height="120"></canvas>
    <div class="row">
      <label>Model
        <select id="model">
          <option>b21</option><option>b1</option><option>b18</option>
          <option>d11</option><option>d110</option>
        </select>
      </label>
      <label>Density <input id="density" type="number" min="1" max="5" value="5"></label>
      <label>Rotate
        <select id="rotate"><option>0</option><option>90</option><option>180</option><option>270</option></select>
      </label>
    </div>
    <div class="row">
      <label>Connection
        <select id="conn"><option>usb</option><option>bluetooth</option></select>
      </label>
      <label>Address <input id="addr" placeholder="/dev/ttyACM0 or MAC"></label>
      <label>Source
        <select id="source"></select>
      </label>
    </div>
    <p id="fields"></p>
    <button type="button" id="fill">Fill from source</button>
    <button type="submit">Print</button>
  </form>
  <script>
    const token = new URLSearchParams(location.search).get("token") || "";
    const status = document.querySelector("#status");
    const canvas = document.querySelector("#preview");
    const ctx = canvas.getContext("2d");
    let image = null;

    function api(path, options) {
      const url = path + (path.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(token);
      return fetch(url, options);
    }

    document.querySelector("#file").addEventListener("change", (event) => {
      const file = event.target.files[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => { image = img; draw(); URL.revokeObjectURL(url); };
      img.src = url;
    });

    function draw() {
      if (!image) return;
      const degrees = Number(document.querySelector("#rotate").value);
      const swap = degrees === 90 || degrees === 270;
      const width = swap ? image.height : image.width;
      const height = swap ? image.width : image.height;
      canvas.width = width;
      canvas.height = height;
      ctx.fillStyle = "white";
      ctx.fillRect(0, 0, width, height);
      ctx.save();
      ctx.translate(width / 2, height / 2);
      ctx.rotate(degrees * Math.PI / 180);
      ctx.drawImage(image, -image.width / 2, -image.height / 2);
      ctx.restore();
    }
    document.querySelector("#rotate").addEventListener("change", draw);

    async function loadSources() {
      const response = await api("/api/sources");
      const body = await response.json();
      const select = document.querySelector("#source");
      select.replaceChildren();
      for (const name of body.sources) {
        const option = document.createElement("option");
        option.textContent = name;
        select.append(option);
      }
    }

    document.querySelector("#fill").addEventListener("click", async () => {
      const name = document.querySelector("#source").value;
      const response = await api("/api/sources/" + encodeURIComponent(name));
      const body = await response.json();
      document.querySelector("#fields").textContent = JSON.stringify(body);
      status.textContent = "filled from " + name;
    });

    document.querySelector("#label").addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!image) { status.textContent = "choose an image"; return; }
      draw();
      const pixels = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
      const gray = new Uint8Array(canvas.width * canvas.height);
      for (let i = 0; i < gray.length; i++) gray[i] = pixels[i * 4];
      let binary = "";
      for (const byte of gray) binary += String.fromCharCode(byte);
      status.textContent = "printing";
      const response = await api("/api/print", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          width: canvas.width,
          height: canvas.height,
          density: Number(document.querySelector("#density").value),
          model: document.querySelector("#model").value,
          conn: document.querySelector("#conn").value,
          addr: document.querySelector("#addr").value,
          rotate: 0,
          pixels_b64: btoa(binary),
        }),
      });
      const body = await response.json();
      status.textContent = body.error || "printed";
    });

    loadSources().catch((error) => { status.textContent = error.message; });
  </script>
</body>
</html>
