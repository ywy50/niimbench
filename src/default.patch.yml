# Niimbench boot list. This file is embedded in the binary. A
# cordis.patch.yml in the current directory overrides it and should stay
# identical unless you mean to patch a local run. `inject` must match
# the plugin declaration.
- id: trace
  plugin: trace

- id: printer
  plugin: printer

- id: transports
  plugin: transports

- id: devices
  plugin: devices

- id: serial
  plugin: serial
  inject: [transports, devices]

- id: bluetooth
  plugin: bluetooth
  inject: [transports, devices]

- id: sources
  plugin: sources

- id: json-source
  plugin: json-source
  inject: [sources]

- id: http
  plugin: http
  inject: [trace, printer, transports, devices, sources]

- id: editor
  plugin: editor
  inject: [http]
